[project]
name = "infrahub-intent-lab"
version = "0.1.0"
description = "A Strands agent that changes intent in Infrahub, deploys the rendered configuration to Containerlab switches and verifies it"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "strands-agents[anthropic,gemini,openai]>=1.61.1,<2",
    "netmiko>=4.7,<5",
    "infrahub-sdk[all]==1.23.2",
]

[project.urls]
Repository = "https://github.com/thomas-rotszyld-nc/network-agent-strands"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
